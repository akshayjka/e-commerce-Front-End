<mat-card>

    <h1 class="title-text">Login</h1>
    <mat-card-title class="mt-3 p-2">
        Sign In
    </mat-card-title>

    <form [formGroup]="loginForm">

        <div class="row mt-4">

            <div class="col-lg-12 col-md-12 col-sm-12">
                <span class=" me-5">
                    <app-input label="Email Address"
                        placeholder="Enter Your email Address"
                        [isRequired]="true" formControlName="email" type="email"
                        errorMessage="Enter Name"></app-input>
                </span>
            </div>

        </div>

        <div class="row mt-2">
            <div class="col-lg-12 col-md-12 col-sm-12">

                <span class="me-5">
                    <app-input label="Password"
                        placeholder="Enter Your Password"
                        formControlName="password" [isRequired]="true"
                        type="password"></app-input>
                </span>

            </div>

        </div>

        <div class="row footer-action">

            <a class="forgot-password" href="" > Forgot Password ?</a>

            <div class="col-lg-4 col-md-6 col-sm-12">
                <button mat-raised-button class="save-button" type="submit"
                    [disabled]="loginForm.invalid" (click)="toLogin()" color="primary">
                    <i class="bi bi-arrow-right-square"></i>
                    Login</button>
            </div>

            <div class="col-lg-5 col-md-6 col-sm-12">
                <button mat-raised-button class="info-button" color="warn" (click)="gotoRegister()">
                    <i class="bi bi-tencent-qq"></i>
                    Need to Register ?</button>
            </div>

            <div class="col-lg-3 col-md-6 col-sm-12">
                <button mat-raised-button class="cancel-button" color="warn" (click)="clearForm()">
                    <i class="bi bi-backspace"></i>
                    Back</button>
            </div>
        </div>
    </form>
</mat-card>
